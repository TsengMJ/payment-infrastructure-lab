title = "payment-infrastructure-lab"

[extend]
useDefault = true

# Atlas checksum lines are hashes of SQL files. A filename that contains
# "api_key" makes the generic-api-key rule treat the checksum as a secret.
[allowlist]
description = "Atlas migration checksums are not credentials"
paths = [
  '''migrations/.*/atlas\.sum''',
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
]
