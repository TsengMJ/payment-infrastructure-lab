name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: make lint
      - run: make test-unit
      - run: make test-integration
      - run: make vuln
      - run: make gosec
      - run: make secrets
