name: payment-lab

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payment}
      POSTGRES_DB: ${POSTGRES_DB:-payment_dev}
      # Pass-through only. A value on this line is what secret scanners match.
      POSTGRES_PASSWORD:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18 images keep data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP on purpose: the image's init-time server listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.9
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ../otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 9090 on the host is a common local-proxy controller port, so publish 9091.
    ports:
      - "127.0.0.1:9091:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
